name: s731n-build

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b8ef920e-root-my-galaxy-payloads
    paths:
      - ".github/workflows/s731n-build.yml"
      - "src/targets/essi-S731NKSS7BZF1/**"
      - "tools/generate_p0_fingerprint.pl"
      - "Makefile"
      - "src/**"

permissions:
  contents: write

concurrency:
  group: s731n-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore kernel image
        uses: actions/cache/restore@v4
        with:
          path: fw/ap/kernel
          key: s731n-kernel-v1

      - name: Install NDK r29
        run: |
          set -euxo pipefail
          cd /opt
          curl -fsSL --retry 3 -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          unzip -q ndk.zip
          ls -d /opt/android-ndk-*
          /opt/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang --version

      - name: Generate P0 fingerprint
        run: |
          set -euxo pipefail
          mkdir -p ci-out src/targets/essi-S731NKSS7BZF1
          perl tools/generate_p0_fingerprint.pl \
            fw/ap/kernel 0x1f0000 \
            src/targets/essi-S731NKSS7BZF1/p0_fingerprint.h
          head -30 src/targets/essi-S731NKSS7BZF1/p0_fingerprint.h

      - name: Build release payload
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME=/opt/android-ndk-r29
          make TARGET=essi-S731NKSS7BZF1 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          ls -la build/essi-S731NKSS7BZF1/

      - name: Verify payload size
        run: |
          set -euxo pipefail
          SIZE=$(stat -c %s build/essi-S731NKSS7BZF1/cve-2026-43499-app.release.so)
          echo "payload size: $SIZE"
          test "$SIZE" -le 104128
          sha256sum build/essi-S731NKSS7BZF1/cve-2026-43499-app.release.so \
            | tee ci-out/app-so.txt

      - name: Commit build artifacts
        run: |
          set -uo pipefail
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          mkdir -p artifacts/essi-S731NKSS7BZF1
          cp build/essi-S731NKSS7BZF1/cve-2026-43499-app.release.so \
            artifacts/essi-S731NKSS7BZF1/cve-2026-43499-app.so
          git add -A artifacts/essi-S731NKSS7BZF1 src/targets/essi-S731NKSS7BZF1 ci-out
          git commit -q -m "build: S731NKSS7BZF1 release payload and P0 fingerprint" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin arena/b8ef920e-root-my-galaxy-payloads >/dev/null 2>&1 || true
            if git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads; then exit 0; fi
            sleep 10
          done
          echo "push failed"
