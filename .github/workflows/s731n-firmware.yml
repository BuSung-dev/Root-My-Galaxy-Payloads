name: s731n-firmware

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b8ef920e-root-my-galaxy-payloads

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install samloader
        run: |
          set -euxo pipefail
          mkdir -p /tmp/sl
          cd /tmp/sl
          if curl -fsSL --retry 3 -o sl.zip \
            "https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip"; then
            unzip -o sl.zip
          else
            echo "release asset unavailable, building from source"
            curl -fsSL --retry 3 -o sl.tar.gz \
              "https://codeload.github.com/topjohnwu/samloader-rs/tar.gz/refs/tags/2.2.0"
            tar xzf sl.tar.gz
            cd samloader-rs-2.2.0
            cargo build --release --locked -p samloader --no-default-features --features nusb
            cp target/release/samloader /tmp/sl/
            cd /tmp/sl
          fi
          chmod +x /tmp/sl/samloader
          /tmp/sl/samloader --version

      - name: Check-update across regions
        run: |
          set -uo pipefail
          mkdir -p ci-out
          : > ci-out/versions.txt
          for region in KOO LUC KOS KTC KCC; do
            echo "=== region $region ===" | tee -a ci-out/versions.txt
            timeout 420 /tmp/sl/samloader check-update \
              --model SM-S731N --region "$region" --all 2>&1 \
              | tee -a ci-out/versions.txt || echo "region $region failed" | tee -a ci-out/versions.txt
            echo | tee -a ci-out/versions.txt
          done

      - name: Download firmware
        run: |
          set -uo pipefail
          mkdir -p fw
          cd fw
          ok=0
          for region in KOO LUC; do
            echo "=== trying region $region ==="
            if timeout 9000 /tmp/sl/samloader download \
                --model SM-S731N --region "$region" \
                --version "S731NKSS7BZF1/S731NOKR7BZF1/S731NKSS7BZE1/S731NKSS7BZF1" \
                --threads 16 --out-file "fw_${region}.zip"; then
              echo "DOWNLOAD_OK region=$region"
              ok=1
              break
            fi
            echo "region $region download failed"
          done
          ls -la > ../ci-out/fw-files.txt
          echo "download_ok=$ok" >> ../ci-out/fw-files.txt
          exit 0

      - name: Extract AP boot image and kernel
        run: |
          set -uo pipefail
          cd fw
          rm -rf extracted ap
          for z in *.zip; do
            [ -f "$z" ] || continue
            echo "unzip $z"
            unzip -o "$z" -d extracted || true
          done
          ls -la extracted >> ../ci-out/fw-files.txt 2>&1 || true
          for t in extracted/*.tar.md5; do
            [ -f "$t" ] || continue
            echo "AP tar candidate: $t"
            mkdir -p ap
            if tar -xf "$t" -C ap boot.img.lz4 2>/dev/null && [ -f ap/boot.img.lz4 ]; then
              echo "AP_TAR=$t" >> ../ci-out/fw-files.txt
              tar -xf "$t" -C ap meta-data/fota.zip 2>/dev/null || true
              break
            fi
          done
          ls -la ap >> ../ci-out/fw-files.txt 2>&1 || true
          if [ -f ap/boot.img.lz4 ]; then
            lz4 -d -f ap/boot.img.lz4 ap/boot.img
            python3 - > ../ci-out/kernel.txt <<'PY'
          import struct, hashlib, pathlib, re
          boot = pathlib.Path("ap/boot.img").read_bytes()
          ksize = struct.unpack_from("<I", boot, 0x08)[0]
          kern = boot[0x1000:0x1000 + ksize]
          pathlib.Path("ap/kernel").write_bytes(kern)
          print("boot.img size:", len(boot))
          print("boot.img sha256:", hashlib.sha256(boot).hexdigest().upper())
          print("kernel size:", ksize)
          print("kernel sha256:", hashlib.sha256(kern).hexdigest().upper())
          m = re.search(rb"Linux version [0-9][^\x00]{0,160}", kern)
          print("banner:", m.group(0).decode("ascii", "replace") if m else "NOT FOUND")
          # ARM64 Image header
          print("image magic:", kern[0x38:0x3c].hex(), "text_offset:", struct.unpack_from("<Q", kern, 0x8)[0])
          print("image size field:", struct.unpack_from("<Q", kern, 0x10)[0], "flags:", hex(struct.unpack_from("<Q", kern, 0x30)[0]))
          PY
          fi
          if [ -f ap/meta-data/fota.zip ]; then
            mkdir -p ap/meta-data/x && unzip -o -j ap/meta-data/fota.zip -d ap/meta-data/x >/dev/null 2>&1 || true
            for f in ap/meta-data/x/*; do
              [ -f "$f" ] || continue
              echo "--- $f"
              grep -E "ro\.build\.(fingerprint|display\.id|version\.incremental|date)|ro\.product\.(model|device|name)|ro\.build\.version\.(release|sdk|security_patch)|ro\.product\.cpu\.abi" "$f" || true
            done > ../ci-out/props.txt 2>&1
          fi
          du -sh . >> ../ci-out/fw-files.txt

      - name: Cache kernel image
        uses: actions/cache@v4
        with:
          path: fw/ap/kernel
          key: s731n-kernel-v1

      - name: Commit results
        run: |
          set -euxo pipefail
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A ci-out
          git commit -q -m "ci: s731n firmware acquisition results" || echo "nothing to commit"
          git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads
