name: net-probe
on:
  push:
    branches: [arena/b8ef920e-root-my-galaxy-payloads]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b8ef920e-root-my-galaxy-payloads
      - name: probe
        run: |
          mkdir -p ci-out
          {
            for u in \
              "http://fota-cloud-dn.ospserver.net/firmware" \
              "https://fota-cloud-dn.ospserver.net/firmware" \
              "https://fuss.samsungmnox.com/samsung/fuse" \
              "https://samfuss.samsung.com/samsung/fuse" \
              "https://samfrew.com" \
              "https://api.github.com" ; do
              code=$(curl -sS -m 25 -o /dev/null -w "%{http_code}" "$u" 2>&1 || echo ERR)
              echo "$u -> $code"
            done
            echo "--- dns names ---"
            for h in fuss.samsungmnox.com samfuss.samsung.com fota-cloud-dn.ospserver.net samsungmobile.net; do
              echo "$h: $(getent hosts $h || echo NODNS)"
            done
            echo "--- ospserver probe ---"
            curl -sS -m 25 "http://fota-cloud-dn.ospserver.net/firmware/KOO/SM-S731N/version.xml" 2>&1 | head -c 1200
            echo
          } > ci-out/probe.txt 2>&1
      - name: commit
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add ci-out || true
          git commit -q -m "ci: probe results" || true
          git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads
