name: net-probe
on:
  push:
    branches: [arena/b8ef920e-root-my-galaxy-payloads]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b8ef920e-root-my-galaxy-payloads
      - name: probe
        run: |
          mkdir -p ci-out
          {
            echo "--- crates ---"
            for u in "https://static.crates.io/crates/serde/serde-1.0.200.crate" \
                     "https://index.crates.io/config.json" \
                     "https://github.com/topjohnwu/samloader-rs/releases/latest" ; do
              code=$(curl -sSL -m 30 -o /dev/null -w "%{http_code}" "$u" 2>&1 || echo ERR)
              echo "$u -> $code"
            done
            echo "--- neofuss ---"
            getent hosts neofussvr.sslcs.cdngc.net || echo NODNS
            code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "https://neofussvr.sslcs.cdngc.net/SmartHistory.do" 2>&1 || echo ERR)
            echo "history endpoint -> $code"
            echo "--- apt ---"
            apt-cache policy bpftool 2>&1 | head -5
            echo "--- pip ---"
            pip download --no-deps -d /tmp/x lz4 2>&1 | tail -2
            echo "--- cargo target ---"
            rustup target list --installed 2>&1 | head -5
          } > ci-out/probe.txt 2>&1
      - name: commit
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add ci-out || true
          git commit -q -m "ci: probe results" || true
          git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads
