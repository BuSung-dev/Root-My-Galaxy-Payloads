name: s731n-firmware

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b8ef920e-root-my-galaxy-payloads
    paths:
      - ".github/workflows/s731n-port.yml"
      - "ci/extract_kernel.py"

permissions:
  contents: write

concurrency:
  group: s731n-firmware
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install samloader
        run: |
          set -euxo pipefail
          mkdir -p /tmp/sl
          cd /tmp/sl
          if curl -fsSL --retry 3 -o sl.zip \
            "https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip"; then
            unzip -o sl.zip
          else
            echo "release asset unavailable, building from source"
            curl -fsSL --retry 3 -o sl.tar.gz \
              "https://codeload.github.com/topjohnwu/samloader-rs/tar.gz/refs/tags/2.2.0"
            tar xzf sl.tar.gz
            cd samloader-rs-2.2.0
            cargo build --release --locked -p samloader --no-default-features --features nusb
            cp target/release/samloader /tmp/sl/
            cd /tmp/sl
          fi
          chmod +x /tmp/sl/samloader
          /tmp/sl/samloader --version

      - name: Check-update across regions
        run: |
          set -uo pipefail
          mkdir -p ci-out
          : > ci-out/versions.txt
          for region in KOO LUC KTC SKC; do
            echo "=== region $region ===" | tee -a ci-out/versions.txt
            timeout 420 /tmp/sl/samloader check-update \
              --model SM-S731N --region "$region" --all 2>&1 \
              | tee -a ci-out/versions.txt || echo "region $region failed" | tee -a ci-out/versions.txt
            echo | tee -a ci-out/versions.txt
          done

      - name: Download firmware
        run: |
          set -uo pipefail
          mkdir -p fw
          cd fw
          for region in KOO LUC KTC SKC; do
            echo "=== trying region $region ==="
            if timeout 10800 /tmp/sl/samloader download \
                --model SM-S731N --region "$region" \
                --version "S731NKSS7BZF1/S731NOKR7BZF1/S731NKSS7BZE1/S731NKSS7BZF1" \
                --threads 16 --out-file "fw_${region}.zip"; then
              echo "DOWNLOAD_OK region=$region"
              break
            fi
            echo "region $region download failed"
          done
          ls -la > ../ci-out/fw-files.txt
          df -h . >> ../ci-out/fw-files.txt

      - name: Extract AP boot image and kernel
        run: |
          set -uo pipefail
          cd fw
          rm -rf extracted ap
          for z in *.zip; do
            [ -f "$z" ] || continue
            echo "unzip $z"
            unzip -o "$z" -d extracted || true
          done
          ls -la extracted >> ../ci-out/fw-files.txt 2>&1 || true
          for t in extracted/*.tar.md5; do
            [ -f "$t" ] || continue
            echo "AP tar candidate: $t"
            mkdir -p ap
            if tar -xf "$t" -C ap boot.img.lz4 2>/dev/null && [ -f ap/boot.img.lz4 ]; then
              echo "AP_TAR=$t" >> ../ci-out/fw-files.txt
              tar -xf "$t" -C ap meta-data/fota.zip 2>/dev/null || true
              break
            fi
          done
          ls -la ap >> ../ci-out/fw-files.txt 2>&1 || true
          if [ -f ap/boot.img.lz4 ]; then
            lz4 -d -f ap/boot.img.lz4 ap/boot.img
            python3 ../ci/extract_kernel.py > ../ci-out/kernel.txt
            cat ../ci-out/kernel.txt
          fi
          if [ -f ap/meta-data/fota.zip ]; then
            mkdir -p ap/meta-data/x
            unzip -o -j ap/meta-data/fota.zip -d ap/meta-data/x >/dev/null 2>&1 || true
            {
              echo "=== build_fingerprint.txt ==="
              cat ap/meta-data/x/build_fingerprint.txt 2>/dev/null || echo "MISSING"
              echo
              echo "=== build.prop (selected) ==="
              grep -E "^ro\.(build\.(fingerprint|display\.id|id|version\.incremental|version\.release|version\.sdk)|product\.(model|device|name|brand|cpu\.abi))" \
                ap/meta-data/x/build.prop 2>/dev/null || echo "MISSING"
            } > ../ci-out/props.txt
            cat ../ci-out/props.txt
          fi

      - name: Cache kernel image
        uses: actions/cache@v4
        with:
          path: fw/ap/kernel
          key: s731n-kernel-v1

      - name: Commit results
        run: |
          set -uo pipefail
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A ci-out
          git commit -q -m "ci: s731n firmware acquisition results" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin arena/b8ef920e-root-my-galaxy-payloads >/dev/null 2>&1 || true
            if git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads; then exit 0; fi
            sleep 10
          done
          echo "push failed"
