name: s731n-props

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b8ef920e-root-my-galaxy-payloads

permissions:
  contents: write

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install samloader
        run: |
          set -euxo pipefail
          mkdir -p /tmp/sl && cd /tmp/sl
          curl -fsSL --retry 3 -o sl.zip \
            "https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip"
          unzip -o sl.zip
          chmod +x /tmp/sl/samloader

      - name: Download firmware
        run: |
          set -euxo pipefail
          mkdir -p fw && cd fw
          /tmp/sl/samloader download \
            --model SM-S731N --region KOO \
            --version "S731NKSS7BZF1/S731NOKR7BZF1/S731NKSS7BZE1/S731NKSS7BZF1" \
            --threads 16 --out-file "fw_KOO.zip"

      - name: Extract identity properties
        run: |
          set -euxo pipefail
          cd fw
          rm -rf extracted ap
          unzip -o fw_KOO.zip -d extracted
          AP=$(ls extracted/AP_*.tar.md5)
          BL=$(ls extracted/BL_*.tar.md5)
          echo "AP=$AP"
          echo "BL=$BL"
          mkdir -p ap bl
          tar -xf "$AP" -C ap meta-data/fota.zip
          tar -xf "$BL" -C bl sboot.bin.lz4 || tar -xf "$BL" -C bl
          mkdir -p ap/meta-data/x
          unzip -o -j ap/meta-data/fota.zip -d ap/meta-data/x >/dev/null
          ls -la ap/meta-data/x/build.prop ap/meta-data/x/build_fingerprint.txt
          {
            echo "=== build_fingerprint.txt ==="
            cat ap/meta-data/x/build_fingerprint.txt
            echo
            echo "=== build.prop (identity) ==="
            grep -E "^ro\.(build\.fingerprint|build\.display\.id|build\.id|build\.version\.incremental|build\.version\.release|build\.version\.sdk|build\.version\.security_patch|product\.(model|device|name|brand)|boot\.veritymode)" \
              ap/meta-data/x/build.prop || true
            echo
            echo "=== ro.product.* ==="
            grep -E "^ro\.product\." ap/meta-data/x/build.prop | sort || true
            echo
            echo "=== ro.build.* ==="
            grep -E "^ro\.build\." ap/meta-data/x/build.prop | sort || true
          } > ../ci-out/props.txt
          cat ../ci-out/props.txt

      - name: Cache identity and bootloader artifacts
        uses: actions/cache@v4
        with:
          path: |
            fw/ap/meta-data/x/build.prop
            fw/ap/meta-data/x/build_fingerprint.txt
            fw/bl
          key: s731n-identity-v1

      - name: Commit results
        run: |
          set -euxo pipefail
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A ci-out
          git commit -q -m "ci: s731n firmware identity properties" || echo "nothing to commit"
          git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads
