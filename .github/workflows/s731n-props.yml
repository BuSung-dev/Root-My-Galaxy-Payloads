name: s731n-props

on:
  workflow_dispatch:
  push:
    branches:
      - arena/b8ef920e-root-my-galaxy-payloads
    paths:
      - ".github/workflows/s731n-props.yml"

permissions:
  contents: write

concurrency:
  group: s731n-props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install samloader
        run: |
          set -euxo pipefail
          mkdir -p /tmp/sl && cd /tmp/sl
          curl -fsSL --retry 3 -o sl.zip \
            "https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip"
          unzip -o sl.zip
          chmod +x /tmp/sl/samloader

      - name: Download firmware
        run: |
          set -euxo pipefail
          mkdir -p fw && cd fw
          /tmp/sl/samloader download \
            --model SM-S731N --region KOO \
            --version "S731NKSS7BZF1/S731NOKR7BZF1/S731NKSS7BZE1/S731NKSS7BZF1" \
            --threads 16 --out-file "fw_KOO.zip"

      - name: Extract firmware identity
        run: |
          set -euxo pipefail
          cd fw
          rm -rf extracted ap
          unzip -o fw_KOO.zip -d extracted
          AP=$(ls extracted/AP_*.tar.md5)
          CSC=$(ls extracted/CSC_*.tar.md5)
          BL=$(ls extracted/BL_*.tar.md5)
          echo "AP=$AP"
          echo "CSC=$CSC"
          echo "BL=$BL"
          mkdir -p ap bl
          tar -xf "$AP" -C ap meta-data/fota.zip
          tar -xf "$CSC" -C ap system/etc/build.prop 2>/dev/null || true
          tar -xf "$BL" -C bl 2>/dev/null || true
          mkdir -p ap/meta-data/x
          unzip -o -j ap/meta-data/fota.zip -d ap/meta-data/x >/dev/null
          {
            echo "=== build_fingerprint.txt (AP) ==="
            cat ap/meta-data/x/build_fingerprint.txt 2>/dev/null || echo "MISSING"
            echo
            echo "=== AP build.prop (selected) ==="
            grep -E "^ro\.(build\.(fingerprint|display\.id|id|version\.incremental|version\.release|version\.sdk|version\.security_patch|description)|product\.(model|device|name|brand|cpu\.abi))" \
              ap/meta-data/x/build.prop 2>/dev/null || echo "MISSING"
            echo
            echo "=== CSC build.prop (selected) ==="
            if [ -f ap/system/etc/build.prop ]; then
              grep -E "^ro\.(build\.(fingerprint|display\.id|id|version\.incremental|version\.release|version\.sdk|version\.security_patch)|product\.(model|device|name|brand|cpu\.abi))" \
                ap/system/etc/build.prop || echo "MISSING"
            else
              echo "MISSING"
            fi
            echo
            echo "=== CSC file list (top level) ==="
            tar -tf "$CSC" | head -40
          } > ../ci-out/props.txt
          cat ../ci-out/props.txt

      - name: Cache identity and bootloader artifacts
        uses: actions/cache@v4
        with:
          path: |
            fw/ap/meta-data/x/build.prop
            fw/ap/meta-data/x/build_fingerprint.txt
            fw/ap/system/etc/build.prop
            fw/bl
          key: s731n-identity-v1

      - name: Commit results
        run: |
          set -uo pipefail
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A ci-out
          git commit -q -m "ci: s731n firmware identity properties" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin arena/b8ef920e-root-my-galaxy-payloads >/dev/null 2>&1 || true
            if git push origin HEAD:arena/b8ef920e-root-my-galaxy-payloads; then exit 0; fi
            sleep 10
          done
          echo "push failed"
