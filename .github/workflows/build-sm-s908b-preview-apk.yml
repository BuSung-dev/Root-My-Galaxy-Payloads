name: Build SM-S908B Preview APK

on:
  push:
    branches:
      - port-sm-s908b-s908bxxsmgzb2
    paths:
      - "artifacts/b0s-S908BXXSMGZB2/**"
      - "src/targets/b0s-S908BXXSMGZB2/**"
      - "kernelsu/ksud-r0s-S901BXXSNGZD7-kdp"
      - ".github/workflows/build-sm-s908b-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Build S908B PR #272 Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR payload branch
        uses: actions/checkout@v4
        with:
          path: payloads

      - name: Checkout Root My Galaxy app source
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: 23adf39fcd4f1be4e73184ee960a6d5399baf147
          path: app-src

      - name: Verify preview artifacts
        shell: bash
        run: |
          set -euo pipefail

          EXPLOIT_URL="https://raw.githubusercontent.com/peppicry/Root-My-Galaxy-Payloads/${GITHUB_SHA}/artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so"
          KSU_URL="https://raw.githubusercontent.com/peppicry/Root-My-Galaxy-Payloads/${GITHUB_SHA}/kernelsu/ksud-r0s-S901BXXSNGZD7-kdp"

          curl -fsSL "$EXPLOIT_URL" -o /tmp/s908b-exploit.so
          curl -fsSL "$KSU_URL" -o /tmp/s901b-ksud

          test "$(stat -c%s /tmp/s908b-exploit.so)" = "1757752"
          test "$(stat -c%s /tmp/s901b-ksud)" = "4621280"

          printf '%s  %s\n' \
            'd2b52dc52a69571a145a64f0f57ae53884383a996661066ca84b52a45eb691bf' \
            '/tmp/s908b-exploit.so' | sha256sum -c -
          printf '%s  %s\n' \
            'fc0097be827dab2078ba23e7af223905cc8ab38c763a602982071439ae7ed962' \
            '/tmp/s901b-ksud' | sha256sum -c -

      - name: Patch app for S908B preview
        env:
          PAYLOAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          payload_sha = os.environ["PAYLOAD_SHA"]
          app = Path("app-src")

          repo_file = app / "app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt"
          source = repo_file.read_text()
          start = source.index("    fun loadTargets(): List<TargetProfile> {")
          end = source.index("\n\n    fun resolveTarget", start)

          replacement = f'''    fun loadTargets(): List<TargetProfile> = listOf(
              TargetProfile(
                  profileId = "b0s-S908BXXSMGZB2-pr272-preview",
                  displayName = "Galaxy S22 Ultra SM-S908B | Kernel 5.10.237 | EXPERIMENTAL (validated on GZB2)",
                  models = setOf("SM-S908B"),
                  kernelVersions = setOf("5.10.237"),
                  exploit = RemoteArtifact(
                      url = "https://raw.githubusercontent.com/peppicry/Root-My-Galaxy-Payloads/{payload_sha}/artifacts/b0s-S908BXXSMGZB2/cve-2026-43499-app.so",
                      size = 1757752L,
                  ),
                  kernelSu = RemoteArtifact(
                      url = "https://raw.githubusercontent.com/peppicry/Root-My-Galaxy-Payloads/{payload_sha}/kernelsu/ksud-r0s-S901BXXSNGZD7-kdp",
                      size = 4621280L,
                  ),
              ),
          )'''
          repo_file.write_text(source[:start] + replacement + source[end:])

          gradle = app / "app/build.gradle.kts"
          gradle_text = gradle.read_text()
          old_app_id = 'applicationId = "dev.busung.s25uroot"'
          new_app_id = 'applicationId = "dev.busung.s25uroot.s908bpreview"'
          if old_app_id not in gradle_text:
              raise SystemExit("expected applicationId not found")
          gradle.write_text(gradle_text.replace(old_app_id, new_app_id, 1))

          changed_labels = 0
          for strings in (app / "app/src/main/res").glob("values*/strings.xml"):
              text = strings.read_text()
              patched, count = re.subn(
                  r'(<string name="app_name">).*?(</string>)',
                  r'\1Root My Galaxy — S908B Preview\2',
                  text,
                  count=1,
              )
              if count:
                  strings.write_text(patched)
                  changed_labels += 1

          if changed_labels == 0:
              raise SystemExit("no app_name resources patched")

          print(f"Preview profile pinned to payload commit {payload_sha}")
          print(f"Patched app label in {changed_labels} locale resource files")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        working-directory: app-src
        run: ./gradlew assembleDebug --no-daemon

      - name: Package preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-output
          cp app-src/app/build/outputs/apk/debug/app-debug.apk \
            preview-output/RootMyGalaxy-S908B-PR272-Preview.apk

          cat > preview-output/PREVIEW-BUILD.txt <<EOF
          Root My Galaxy — SM-S908B PR #272 Preview

          Status: EXPERIMENTAL / COMMUNITY TEST BUILD
          Device matcher: SM-S908B
          Kernel matcher: 5.10.237
          Firmware barrier: none
          Hardware-validated firmware: S908BXXSMGZB2

          Exploit source/artifact:
          peppicry/Root-My-Galaxy-Payloads@${GITHUB_SHA}
          SHA-256: d2b52dc52a69571a145a64f0f57ae53884383a996661066ca84b52a45eb691bf

          KernelSU candidate:
          S901BXXSNGZD7 ksud-r0s-S901BXXSNGZD7-kdp
          Bundled in this PR from:
          enej-git/Root-My-Galaxy-Payloads@40fcda771d637f1ae5ddae7ebe3ba8264f347395 (PR #138)
          SHA-256: fc0097be827dab2078ba23e7af223905cc8ab38c763a602982071439ae7ed962

          The S901B KernelSU candidate has been observed working on the hardware-validated
          S908B GZB2 test device, but this does not establish compatibility with every
          SM-S908B firmware. Other firmware versions are experimental tests performed at
          the tester's own risk.
          EOF

          (cd preview-output && sha256sum RootMyGalaxy-S908B-PR272-Preview.apk > SHA256SUMS.txt)

      - name: Upload S908B preview APK
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-S908B-PR272-Preview
          path: preview-output/*
          if-no-files-found: error
          retention-days: 30
