name: Import device repository histories
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type IMPORT to import both repositories into their device branches'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: root-my-galaxy-device-history-import
  cancel-in-progress: false
jobs:
  import:
    if: ${{ inputs.confirmation == 'IMPORT' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import and push full history
        env:
          GIT_AUTHOR_NAME: Root My Galaxy Migration
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/import-device-history.sh --push
